// ---------- Catmull-Rom smooth path through given points (dots always sit exactly on the line) ----------
function smoothPath(pts){
  let d = 'M '+pts[0][0]+','+pts[0][1]+' ';
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d += 'C '+c1x+','+c1y+' '+c2x+','+c2y+' '+p2[0]+','+p2[1]+' ';
  }
  return d;
}
function arcFlow(nodes, opts){
  opts = opts||{};
  const vbW=1000, vbH=opts.vbH||264;
  const pts = nodes.map(n=>[n.x, n.y]);

  const dots = nodes.map(n=>'<circle cx="'+n.x+'" cy="'+n.y+'" r="9" fill="'+(n.color||'#ed1c24')+'" stroke="#fff" stroke-width="2"/>').join('');
  const svg = '<svg class="arc-flow-svg" viewBox="0 0 '+vbW+' '+vbH+'" preserveAspectRatio="none">'
    + '<path d="'+pathD+'" fill="none" stroke="'+(opts.stroke||'#e2e2df')+'" stroke-width="2.5"/>'
    + dots + '</svg>';
  const labels = nodes.map(n=>{
    const left=(n.x/vbW*100).toFixed(2)+'%';
    const top=(n.y/vbH*100).toFixed(2)+'%';
    const cls='arc-node'+(opts.compact?' compact':'')+(n.below?' below':'');
    return '<div class="'+cls+'" style="left:'+left+';top:'+top+'"><strong>'+n.title+'</strong><span>'+n.sub+'</span></div>';
  }).join('');
  return '<div class="arc-flow" style="'+(opts.height?('height:'+opts.height+'px'):'')+'">'+svg+labels+'</div>';

// ============ 10. Stakeholder Mapping — rounder dots, mathematically perfect arc ============
{
  const wrap = document.querySelector('#section-2-stakeholder .stakeholder-arc-wrap');
  if(wrap){
    const nodes = [
      {x:130, title:'PMC', sub:'JLL'},
      {x:315, title:'Civil', sub:'Capacite'},
      {x:500, title:'MEP Consultant', sub:'Rayls'},
      {x:685, title:'Architect', sub:'SOM + TPA'},
      {x:870, title:'Client', sub:'Hinduja'}
    ];
    const vbW=1000, vbH=264, baseY=230, peakY=50, midX=500, halfW=500;
    const yAt = x => peakY + (baseY-peakY) * Math.pow((x-midX)/halfW, 2);
    const p0x=0, p1x=1000;
    const p0y=yAt(p0x), p1y=yAt(p1x), pmy=yAt(midX);
    const ctrlY = 2*pmy - 0.5*(p0y+p1y);
    const pathD = 'M '+p0x+','+p0y+' Q '+midX+','+ctrlY+' '+p1x+','+p1y;
    const dots = nodes.map(n=>'<circle cx="'+n.x+'" cy="'+yAt(n.x)+'" r="13" fill="#ed1c24" stroke="#fff" stroke-width="3"/>').join('');
    const svg = '<svg class="arc-flow-svg" viewBox="0 0 '+vbW+' '+vbH+'" preserveAspectRatio="none"><path d="'+pathD+'" fill="none" stroke="#e2e2df" stroke-width="2.5" stroke-linecap="round"/>'+dots+'</svg>';
    const labels = nodes.map(n=>{
      const left=(n.x/vbW*100).toFixed(2), top=(yAt(n.x)/vbH*100).toFixed(2);
      return '<div class="arc-node" style="left:'+left+'%;top:'+top+'%">' + '<strong>'+n.title+'</strong><span>'+n.sub+'</span></div>';
    }).join('');
    wrap.innerHTML = '<div class="arc-flow" style="height:280px">'+svg+labels+'</div>';
  }
}

<script>
(function(){
  var m = location.hash.match(/slide=([\w-]+)/);
  if(!m) return;
  var id = m[1], target = document.getElementById(id);
  if(!target) return;
  document.documentElement.classList.add('embed-slide');
  // One screen per frame: navigating to another screen is a no-op here.
  window.show = function(){};
  var enter = document.querySelector('.title-enter-v9');
  if(enter) enter.onclick = null;
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  if(id === 'intro'){
    var replay = document.getElementById('replay');
    if(replay) replay.click();
    return;
  }
  // Activate after the first frame so the screen's own entrance
  // transitions (keyed off .active) actually play.
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    target.classList.add('active');
    try{ if(typeof updateDeckUI === 'function') updateDeckUI(id); }catch(e){}
  }); });
})();
</script>
